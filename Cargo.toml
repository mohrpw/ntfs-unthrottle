[package]
name = "ntfs-unthrottle"
version = "0.5.0"
edition = "2021"
rust-version = "1.83"
description = "Spürt kontraproduktive NTFS-/WOF-Komprimierung auf großen Binärdateien auf und entfernt sie."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ntfs", "compression", "windows", "wof", "cli"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "ntfs_unthrottle"
path = "src/lib.rs"

[[bin]]
name = "ntfs-unthrottle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
humansize = "2.1"
indicatif = "0.17"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
