[package]
name = "ntfs-unthrottle"
version = "0.7.0"
edition = "2021"
rust-version = "1.83"
description = "Detects and removes counterproductive NTFS/WOF compression that throttles Windows file I/O."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ntfs", "compression", "windows", "wof", "cli"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "ntfs_unthrottle"
path = "src/lib.rs"

[[bin]]
name = "ntfs-unthrottle"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Volume/drive diagnostics (`ntfs_unthrottle::tune`): registry, BypassIO, TRIM, MFT.
tune = ["windows-sys/Win32_System_Registry", "windows-sys/Win32_Globalization"]
# The command-line tool. Library users can opt out with `default-features = false`.
cli = [
    "tune",
    "windows-sys/Win32_Globalization",
    "windows-sys/Win32_System_Console",
    "dep:clap",
    "dep:console",
    "dep:humansize",
    "dep:indicatif",
    "dep:serde_json",
    "dep:walkdir",
]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
console = { version = "0.15", optional = true }
humansize = { version = "2.1", optional = true }
indicatif = { version = "0.17", optional = true }
serde_json = { version = "1.0", optional = true }
walkdir = { version = "2.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
